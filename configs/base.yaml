defaults:
  - train: default
  - reps: 6d
  - _self_

seed: 123
device: auto

data:
  num_points: 32
  obs_noise_std: 0.01
  rot_noise_std: 0.00

model:
  hidden_dim: 256
  depth: 3
  dropout: 0.0

head:
  euler_angle_range: 3.14159
  euler_use_tanh: true
  lie_max_angle: 3.14159
  lie_use_tanh: true

splits:
  n_train: 20000
  n_val: 2000
  n_test: 2000

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_${reps.rep}
